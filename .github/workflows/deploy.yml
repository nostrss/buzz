# Fork-only: roll the production relay forward after a successful image build.
#
# Runs when "Docker image" completes on the deploy branch, SSHes into the
# relay host, and runs the compose bundle's upgrade (pull + recreate).
# Secrets: DEPLOY_SSH_KEY (private key registered on the host),
#          DEPLOY_HOST (host or IP).
name: Deploy relay

on:
  workflow_run:
    workflows: ["Docker image"]
    types: [completed]
    branches: [deploy]

permissions: {}

concurrency:
  group: deploy-relay
  cancel-in-progress: false

jobs:
  upgrade:
    name: Upgrade relay on host
    if: github.event.workflow_run.conclusion == 'success' && github.repository != 'block/buzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Upgrade relay over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "root@$HOST" \
            'cd /root/buzz/deploy/compose && BUZZ_COMPOSE_TLS=true ./run.sh upgrade'

      - name: Verify relay health
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://app.pegboard.me/_readiness" | grep -q '"ready"'; then
              echo "relay ready"
              exit 0
            fi
            sleep 10
          done
          echo "::error::relay did not become ready after upgrade"
          exit 1
